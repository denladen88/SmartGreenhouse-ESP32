name: smartgreenhouse
services:
  backend:
    image: ghcr.io/denladen88/smartgreenhouse-backend:latest
    build:
      context: .
      dockerfile: Backend/Dockerfile
    restart: unless-stopped
    env_file:
      - path: ./Backend/.env
        required: false
    ports:
      - "8080:8080"
    volumes:
      - greenhouse_data:/app/data
    # Якщо контейнер не бачить MQTT-брокер / ESP32-CAM у LAN
    # за стандартною bridge-мережею — розкоментуй:
    # network_mode: host

volumes:
  greenhouse_data:
