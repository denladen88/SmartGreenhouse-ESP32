name: smartgreenhouse
services:
  backend:
    image: ghcr.io/denladen88/smartgreenhouse-backend:latest
    build:
      context: .
      dockerfile: Backend/Dockerfile
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"     # один файл логу не більше 10 МБ
        max-file: "3"        # тримати максимум 3 файли (ротація) → стеля ~30 МБ
    env_file:
      - path: ./Backend/.env
        required: false
    ports:
      - "8080:8080"
    volumes:
      - greenhouse_data:/app/data
    # Якщо контейнер не бачить MQTT-брокер / ESP32-CAM у LAN
    # за стандартною bridge-мережею — розкоментуй:
    # network_mode: host

volumes:
  greenhouse_data:
